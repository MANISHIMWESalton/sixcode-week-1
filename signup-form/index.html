<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SixCode Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-card">
        <h1>Join SixCode Academy</h1>
        <p class="intro">Create your account and choose a membership plan.</p>

        <form>
            <div class="row">
                <div class="field">
                    <label for="firstname">First name</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Salton" required>
                </div>
                <div class="field">
                    <label for="lastname">Last name</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Joe" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="joe@example.com" required>
            </div>

            <div class="field">
                <label for="plan">Membership plan</label>
                <select name="plan" id="plan" required>
                    <option value="" disabled selected>Choose a plan</option>
                    <option value="basic">Basic - $19 / month</option>
                    <option value="standard">Standard - $49 / month</option>
                    <option value="premium">Premium - $99 / month</option>
                </select>
            </div>

            <fieldset>
                <legend>Preferred learning time</legend>
                <div class="options">
                    <label class="option">
                        <input type="radio" value="morning" name="time" checked>
                        Morning (8am - 12pm)
                    </label>
                    <label class="option">
                        <input type="radio" value="afternoon" name="time">
                        Afternoon (12pm - 5pm)
                    </label>
                    <label class="option">
                        <input type="radio" value="evening" name="time">
                        Evening (5pm - 9pm)
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="goals">What do you want to learn?</label>
                <textarea name="goals" id="goals" placeholder="For example: learn JavaScript"></textarea>
            </div>

            <div class="field">
                <label class="checkbox">
                    <input type="checkbox" name="terms" required>
                    I agree to the terms and privacy policy
                </label>
            </div>

            <button type="submit">Create account</button>
        </form>
    </main>
</body>
</html>
